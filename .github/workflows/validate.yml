name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: HA ${{ matrix.ha }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            ha: '2026.2.3'
            plugin: '0.13.316'
          - python: '3.14'
            ha: '2026.10.4'
            plugin: '0.13.375'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install HA test environment
        run: >-
          python -m pip install
          'pytest-homeassistant-custom-component==${{ matrix.plugin }}'
          'homeassistant==${{ matrix.ha }}'
      - name: Run regression tests
        run: python -m pytest tests -q
      - name: Validate and build installation ZIP
        run: python scripts/package_ha.py

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate tag and package
        run: python scripts/package_ha.py --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/kickrvent-*.zip
          --title "KickrVent $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
